name: Restore Home Script Clean

on:
  push:
    paths:
      - '.github/workflows/restore-home-script-clean.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore known-good homepage script
        shell: bash
        run: |
          git show e99862247b8e9a3ebd328a8a3a81725defae40d9:script.js > script.js
          node --check script.js

      - name: Commit restored script
        shell: bash
        run: |
          git config user.name "Daksh Rojgar Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -- script.js
          if git diff --cached --quiet; then
            echo "No script changes"
            exit 0
          fi
          git commit -m "Restore working homepage live data script"
          git push origin HEAD:main
