name: Enable PDF Workbench V2

on:
  push:
    paths:
      - '.github/workflows/enable-pdf-workbench-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add PDF workbench v2 assets
        run: |
          python3 -c "from pathlib import Path; p=Path('pdf-workbench.html'); s=p.read_text(encoding='utf-8-sig'); s=s.replace('<link rel=\"stylesheet\" href=\"site-upgrade.css\">','<link rel=\"stylesheet\" href=\"site-upgrade.css\">\n    <link rel=\"stylesheet\" href=\"pdf-workbench-v2.css\">'); s=s.replace('<script src=\"pdf-workbench.js\"></script>','<script src=\"pdf-workbench.js\"></script>\n<script src=\"pdf-workbench-entry.js\"></script>'); p.write_text(s,encoding='utf-8')"

      - name: Commit
        run: |
          git config user.name "Daksh Rojgar Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -- pdf-workbench.html
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Enable direct PDF tool screen and layout"
          git push origin HEAD:main
