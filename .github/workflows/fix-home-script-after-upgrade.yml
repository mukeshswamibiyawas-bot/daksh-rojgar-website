name: Repair Home Script After UI Upgrade
on:
  push:
    paths:
      - '.github/workflows/fix-home-script-after-upgrade.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair getItemDestination and validate JS
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          p=Path('script.js')
          s=p.read_text(encoding='utf-8-sig')
          replacement=r'''function getItemDestination(item) {
              if (item && item.source_type === "post" && item.id) {
                  return {
                      url: `post.html?id=${encodeURIComponent(item.id)}`,
                      external: false,
                  };
              }

              if (item && item.source_type === "job" && item.id) {
                  return {
                      url: `job.html?id=${encodeURIComponent(item.id)}`,
                      external: false,
                  };
              }

              return {
                  url: "#",
                  external: false,
              };
          }
          '''
          s2,n=re.subn(r'function getItemDestination\(item\) \{.*?(?=/\* =================================\n   Fast Website Content Cache)',replacement+'\n',s,count=1,flags=re.S)
          if n != 1:
              raise SystemExit('Could not locate getItemDestination block')
          p.write_text(s2,encoding='utf-8')
          PY
          node --check script.js
          node --check listing.js
      - name: Commit repair
        shell: bash
        run: |
          git config user.name "Daksh Rojgar Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -- script.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Repair home notification detail routing"
          git push origin HEAD:main
